name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact: windows

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: campus-job-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: campus-job-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            campus-job-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            campus-job-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            campus-job-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            campus-job-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
